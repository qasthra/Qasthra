name: Build Android app
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build release
        working-directory: android
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew --no-daemon assembleRelease bundleRelease; else gradle --no-daemon assembleRelease bundleRelease; fi
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          OUT=android/app/build/outputs
          UNSIGNED=$(ls $OUT/apk/release/*.apk | head -n 1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/signing.keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out dist/Qasthra.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs dist/Qasthra.apk | head -n 5
          cp $OUT/bundle/release/*.aab dist/Qasthra.aab
          jarsigner -keystore "$RUNNER_TEMP/signing.keystore" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD dist/Qasthra.aab "$KEY_ALIAS"
          rm -f "$RUNNER_TEMP/signing.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: Qasthra-signed
          path: dist/
